name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true

jobs:
  build:
    name: Build OTP Release
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8

    permissions:
      contents: write

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ELIXIR_ERL_OPTIONS: "+fnu"
      MIX_ENV: prod
      # Build every `rustler_precompiled` NIF from source inside this
      # container instead of downloading upstream's prebuilt artifact.
      #
      # Only `mdex_native` uses rustler_precompiled today, and its upstream
      # x86_64-unknown-linux-gnu artifact is linked against a glibc newer
      # than ubi8's: it requires symbols up to GLIBC_2.34, so v0.1.64 could
      # not boot on RHEL 8.10 / glibc 2.28 at all (#1728) — `kernel` died in
      # `on_load` and the deploy auto-rolled back. Building it here links it
      # against this image's glibc 2.28, which makes the release portable to
      # every host at or above the build image, the same as every other `.so`
      # we ship. The "Check shipped binaries…" step below enforces that.
      #
      # This is release-only: dev machines and the PR CI job leave the
      # variable unset and keep using the downloaded artifact, so they need
      # no Rust toolchain.
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            curl \
            make \
            gcc \
            gcc-c++ \
            binutils \
            perl \
            perl-IPC-Cmd \
            ncurses-devel \
            unzip \
            tar \
            gzip \
            which \
            glibc-langpack-en

      - uses: actions/checkout@v4

      # Erlang/OTP is built from source here, with OpenSSL linked statically
      # into the crypto NIF (#1977). The rabbitmq el8 RPM used until v0.1.69
      # linked it against this image's libcrypto.so.1.1, so the release could
      # not boot on any OpenSSL-3-only host (Fedora >= 36, Ubuntu >= 22.04,
      # Debian >= 12, RHEL 9). Versions and checksums are pinned in the
      # script; the cache is keyed on its contents. The "Check shipped
      # binaries…" steps below enforce the outcome on the packaged tarball.
      - name: Restore Erlang/OTP build cache
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: /opt/otp
          key: otp-static-openssl-ubi8-${{ hashFiles('scripts/build-release-otp.sh') }}

      - name: Build Erlang/OTP 28 with static OpenSSL
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-release-otp.sh --prefix /opt/otp

      - name: Put Erlang/OTP on PATH
        run: |
          echo "/opt/otp/bin" >> "$GITHUB_PATH"
          /opt/otp/bin/erl -noshell -eval 'ok = crypto:start(), io:format("~p~n", [crypto:info_lib()]), halt().'

      - name: Install Elixir 1.19
        run: |
          ELIXIR_VERSION="1.19.0"
          OTP_MAJOR="28"
          curl -fsSL "https://repo.hex.pm/builds/elixir/v${ELIXIR_VERSION}-otp-${OTP_MAJOR}.zip" -o /tmp/elixir.zip
          mkdir -p /opt/elixir
          unzip -q /tmp/elixir.zip -d /opt/elixir
          echo "/opt/elixir/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # Needed only because RUSTLER_PRECOMPILED_FORCE_BUILD_ALL is set for
        # this job (see the job `env` above): the mdex_native NIF is compiled
        # here rather than downloaded. Keep RUST_VERSION at or above the
        # `rust-version` in deps/mdex_native/native/mdex_native_nif/Cargo.toml.
        run: |
          RUST_VERSION="1.91.0"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" --no-modify-path
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          "${HOME}/.cargo/bin/cargo" --version
          "${HOME}/.cargo/bin/rustc" --version

      - name: Verify UTF-8 locale
        run: |
          locale
          python3 -c "import locale; print(locale.getlocale())" || true

      - name: Bootstrap Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Get production dependencies
        run: |
          MIX_ENV=prod mix deps.get --only prod

      - name: Install asset build tools
        run: |
          MIX_ENV=prod mix cmd --app arbiter_web mix assets.setup
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Compile (prod)
        run: |
          MIX_ENV=prod mix compile
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build and digest web assets
        run: |
          MIX_ENV=prod mix cmd --app arbiter_web mix assets.deploy

      - name: Build OTP release
        run: |
          MIX_ENV=prod mix release arbiter
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build arb escript
        run: |
          cd apps/arbiter_cli && MIX_ENV=prod mix escript.build
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Package and checksum release
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TARBALL="arbiter-${TAG}-linux.tar.gz"
          tar -czf "${TARBALL}" -C _build/prod/rel/arbiter .
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          sha256sum apps/arbiter_cli/arb > arb.sha256
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Check shipped binaries against the ubi8 glibc baseline
        # Last line of defence for #1728: fail the release here, naming the
        # file, rather than shipping a tarball that cannot boot on RHEL 8.
        # Runs against the packaged tarball, i.e. exactly what gets published.
        # Locally: scripts/check-release-glibc.sh _build/prod/rel/arbiter
        run: |
          bash scripts/check-release-glibc.sh --baseline 2.28 "${TARBALL}"

      - name: Check shipped binaries only link always-present system libraries
        # Last line of defence for #1977: a bundled .so / ELF binary whose
        # NEEDED libraries include anything outside the allowlist in the
        # script (glibc family, libgcc_s, libstdc++, libtinfo) fails the
        # release here, naming the file and the library — e.g. a crypto NIF
        # that links libcrypto.so.1.1 and so cannot boot on an OpenSSL-3 host.
        # Locally: scripts/check-release-shared-libs.sh _build/prod/rel/arbiter
        run: |
          bash scripts/check-release-shared-libs.sh "${TARBALL}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Arbiter ${{ steps.tag.outputs.name }}"
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            apps/arbiter_cli/arb
            arb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
